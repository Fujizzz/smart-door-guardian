[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-door-guardian"
version = "1.0.0"
description = "A privacy-conscious face-recognition door guardian with PIN fallback, alerts, weather, and audit logs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Project contributors"}]
keywords = ["opencv", "face-recognition", "raspberry-pi", "tkinter", "access-control"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
vision = [
  "numpy>=1.24,<3",
  "opencv-contrib-python>=4.8,<5",
]
speech = ["pyttsx3>=2.90,<3"]
full = [
  "numpy>=1.24,<3",
  "opencv-contrib-python>=4.8,<5",
  "pyttsx3>=2.90,<3",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
door-guardian = "door_guardian.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

